# ASTURCONSOLE — definiciones de disco para Greaseweazle (gw --diskdefs=...)
#
# Los formatos de disco de MSX y del Super Magic Drive / Super Wild Card,
# para leer o escribir disquetes reales con un dispositivo Greaseweazle.
#
# Al indicar --diskdefs=<este archivo>, Greaseweazle deja de cargar su
# propio diskdefs.cfg interno por defecto (el que trae de fábrica, con
# TODOS los formatos estándar ya definidos: msx.*, ibm.*, amiga.*, etc.)
# — pasa a usar ÚNICAMENTE lo que haya en este archivo. Para no perder
# el acceso a esos formatos estándar (verificados y mantenidos por la
# propia comunidad de Greaseweazle desde hace años), se importan aquí
# explícitamente los que tienen sentido para retro-computación de 8/16
# bits — de momento, los de MSX. El prefijo indicado ("msx.") es el que
# hace que aparezcan como "msx.1d", "msx.2dd", etc. — exactamente los
# mismos nombres que usaría alguien tecleando el comando a mano.
import msx. "diskdefs_msx.cfg"

# Perfiles oficiales de Greaseweazle para las máquinas más habituales
# de la retroinformática de 8/16 bits, con la misma lógica de import que
# msx./raw. de arriba: copia local del archivo correspondiente, para que
# --diskdefs=<este archivo> no bloquee el acceso a ellos.
import ibm. "diskdefs_ibm.cfg"
import amiga. "diskdefs_amiga.cfg"
import commodore. "diskdefs_commodore.cfg"
import atarist. "diskdefs_atarist.cfg"
import zx. "diskdefs_zx.cfg"

# El formato "raw" no decodifica ningún sistema de archivos ni sectores
# — captura el flujo magnético a una velocidad de bits fija (125/250/500
# kbps según la densidad del disco), sin interpretar su contenido. Útil
# para discos con un formato desconocido, con protección anticopia, o
# simplemente para conservar una copia de preservación fiel al medio
# físico original antes de intentar decodificarlo de ninguna forma.
import raw. "diskdefs_raw.cfg"

# 360, 720 y 1440 son el estándar de PC/MSX de toda la vida — mismos
# valores que trae la propia distribución de Greaseweazle en sus archivos
# diskdefs_ibm.cfg y diskdefs_msx.cfg, sin cambios.
#
# 800 y 1600 son los formatos "superformateados" propios del SMD/SWC:
# la geometría (cyls/heads/secs) se confirmó analizando el firmware real
# de tres BIOS distintas del Super Magic Drive y del Super Wild Card. El
# valor de gap3, que ASTURCONSOLE no podía verificar por sí solo sin
# hardware, se ha tomado de las definiciones de Greaseweazle para los
# samplers musicales Ensoniq (diskdefs_ensoniq.cfg): usan exactamente la
# misma geometría (80 cyls, 2 heads, 10 o 20 sectores/pista), y esos
# valores de gap3 llevan años verificados por su comunidad de usuarios.

disk asturconsole.360
    cyls = 80
    heads = 1
    tracks * ibm.mfm
        secs = 9
        bps = 512
        gap3 = 84
        rate = 250
    end
end

disk asturconsole.720
    cyls = 80
    heads = 2
    tracks * ibm.mfm
        secs = 9
        bps = 512
        gap3 = 84
        rate = 250
    end
end

disk asturconsole.800
    cyls = 80
    heads = 2
    tracks * ibm.mfm
        secs = 10
        bps = 512
        gap3 = 30
        id = 0
        rate = 250
    end
end

disk asturconsole.1440
    cyls = 80
    heads = 2
    tracks * ibm.mfm
        secs = 18
        bps = 512
        gap3 = 108
        rate = 500
    end
end

disk asturconsole.1600
    cyls = 80
    heads = 2
    tracks * ibm.mfm
        secs = 20
        bps = 512
        gap3 = 40
        id = 0
        rate = 500
    end
end

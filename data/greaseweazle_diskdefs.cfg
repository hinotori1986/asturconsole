# ASTURCONSOLE — definiciones de disco para Greaseweazle (gw --diskdefs=...)
#
# Los formatos de disco de MSX y del Super Magic Drive / Super Wild Card,
# para leer o escribir disquetes reales con un dispositivo Greaseweazle.
#
# 360, 720 y 1440 son el estándar de PC/MSX de toda la vida — mismos
# valores que trae la propia distribución de Greaseweazle en sus archivos
# diskdefs_ibm.cfg y diskdefs_msx.cfg, sin cambios.
#
# 800 y 1600 son los formatos "superformateados" propios del SMD/SWC:
# la geometría (cyls/heads/secs) se confirmó analizando el firmware real
# de tres BIOS distintas del Super Magic Drive y del Super Wild Card. El
# valor de gap3, que ASTURCONSOLE no podía verificar por sí solo sin
# hardware, se ha tomado de las definiciones de Greaseweazle para los
# samplers musicales Ensoniq (diskdefs_ensoniq.cfg): usan exactamente la
# misma geometría (80 cyls, 2 heads, 10 o 20 sectores/pista), y esos
# valores de gap3 llevan años verificados por su comunidad de usuarios.

disk asturconsole.360
    cyls = 80
    heads = 1
    tracks * ibm.mfm
        secs = 9
        bps = 512
        gap3 = 84
        rate = 250
    end
end

disk asturconsole.720
    cyls = 80
    heads = 2
    tracks * ibm.mfm
        secs = 9
        bps = 512
        gap3 = 84
        rate = 250
    end
end

disk asturconsole.800
    cyls = 80
    heads = 2
    tracks * ibm.mfm
        secs = 10
        bps = 512
        gap3 = 30
        id = 0
        rate = 250
    end
end

disk asturconsole.1440
    cyls = 80
    heads = 2
    tracks * ibm.mfm
        secs = 18
        bps = 512
        gap3 = 108
        rate = 500
    end
end

disk asturconsole.1600
    cyls = 80
    heads = 2
    tracks * ibm.mfm
        secs = 20
        bps = 512
        gap3 = 40
        id = 0
        rate = 500
    end
end

## IMG.CFG de ASTURCONSOLE — geometría del "superformato" de 1,6 MB del
## Super Wild Card / Super Magic Drive, para el firmware FlashFloppy de
## un emulador Gotek.
##
## Copia este archivo a la raíz de tu USB del Gotek (o a la carpeta FF/
## si la usas — ver la wiki de FlashFloppy, "IMG.CFG Configuration
## File"). Con esto puesto, cualquier archivo .img/.ima/.dsk de
## exactamente 1.638.400 bytes (1600 KB) se reconoce automáticamente
## como este superformato — puedes guardar la imagen lógica de 1,6 MB
## directamente en el USB, SIN pasar por HFE: FlashFloppy genera el
## flujo MFM real sobre la marcha a partir de esa imagen compacta, en
## vez de tener que llevar guardado el flujo crudo entero (~4 MB por
## disco, más del doble de espacio en el USB para el mismo contenido).
##
## Parámetros confirmados con hardware real (mismos valores que
## data/greaseweazle_diskdefs.cfg y hfe_format.py::dsk_a_hfe en
## ASTURCONSOLE): 20 sectores/pista en vez de los 18 estándar de 1,44 MB
## (de ahí el 1,2 MB extra de capacidad), gap3 más pequeño para que
## quepan, y rate=499 en vez de los 500 kbps "de catálogo" — no es un
## error de redondeo, es el valor concreto que de verdad funciona con
## este hardware. cyls=82, no 80: el propio hardware real (confirmado
## contra un disco superformateado auténtico) espera encontrar declarados
## 82 cilindros aunque el sistema de archivos lógico solo use los
## primeros 80 — las 2 pistas de más quedan en blanco, sin sectores.
## id=1, no 0: el propio codificador MFM de ASTURCONSOLE (hfe_format.py,
## el que ya funciona, verificado contra hardware real) numera los
## sectores del 1 al 20, no del 0 al 19 — con id=0 el firmware del SWC
## busca el sector "1" y no lo encuentra en ningún sitio, exactamente el
## error de lectura reportado.
[swc1600::1638400]
cyls = 82
heads = 2
secs = 20
bps = 512
id = 1
mode = mfm
gap3 = 40
rate = 499

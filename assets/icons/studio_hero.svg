<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icono destacado del Estudio de discos vacios: tres disquetes en
       abanico, uno por cada familia (verde/naranja/azul), con un "+"
       que sugiere creacion -->
  <g transform="rotate(-12 30 50)">
    <rect x="8" y="28" width="52" height="56" rx="5" fill="#161c28" stroke="#3ef29a" stroke-width="3"/>
    <path d="M24 28 H44 V36 H24 Z" fill="#0a0d14"/>
  </g>
  <g transform="rotate(6 48 50)">
    <rect x="22" y="24" width="52" height="56" rx="5" fill="#1a1712" stroke="#ffb454" stroke-width="3"/>
    <path d="M38 24 H58 V32 H38 Z" fill="#0a0d14"/>
  </g>
  <g>
    <rect x="36" y="18" width="52" height="56" rx="5" fill="#12182a" stroke="#5aa0ff" stroke-width="3"/>
    <path d="M52 18 H72 V26 H52 Z" fill="#0a0d14"/>
    <rect x="44" y="34" width="36" height="18" rx="2" fill="#0a0d14" stroke="#5aa0ff" stroke-width="2"/>
  </g>
  <!-- signo "+" flotante -->
  <circle cx="78" cy="76" r="14" fill="#0a0d14" stroke="#f2f4f8" stroke-width="2.5"/>
  <path d="M78 69 V83 M71 76 H85" stroke="#f2f4f8" stroke-width="3" stroke-linecap="round"/>
</svg>

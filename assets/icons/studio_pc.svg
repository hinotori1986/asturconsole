<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Familia PC estandar: el disquete "de toda la vida", sin adornos,
       con las tres siluetas de tamano (8", 5.25", 3.5") en miniatura -->
  <defs>
    <linearGradient id="pcbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182338"/><stop offset="1" stop-color="#0c111c"/>
    </linearGradient>
  </defs>
  <rect x="10" y="8" width="76" height="80" rx="6" fill="url(#pcbg)" stroke="#5aa0ff" stroke-width="3"/>
  <path d="M34 8 H62 V18 H34 Z" fill="#080b12"/>
  <rect x="20" y="26" width="56" height="26" rx="2" fill="#080b12" stroke="#5aa0ff" stroke-width="2"/>
  <rect x="26" y="33" width="44" height="3" rx="1.5" fill="#5aa0ff" opacity="0.55"/>
  <rect x="26" y="40" width="30" height="3" rx="1.5" fill="#5aa0ff" opacity="0.35"/>
  <!-- metal deslizante -->
  <rect x="16" y="60" width="64" height="12" rx="2" fill="#0f1520" stroke="#5aa0ff" stroke-width="2"/>
  <!-- tres siluetas de tamano fisico, de mayor a menor -->
  <rect x="20" y="76" width="14" height="10" rx="1" fill="none" stroke="#5aa0ff" stroke-width="1.6" opacity="0.8"/>
  <rect x="38" y="78" width="11" height="8" rx="1" fill="none" stroke="#5aa0ff" stroke-width="1.6" opacity="0.6"/>
  <rect x="53" y="79.5" width="8" height="6.5" rx="1" fill="#5aa0ff" opacity="0.9"/>
</svg>

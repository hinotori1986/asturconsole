<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="6" y="16" width="26" height="7" rx="2" fill="#8c2d23"/>
  <rect x="6" y="21" width="60" height="42" rx="5" fill="#1a1f2a" stroke="#ff5340" stroke-width="2.5"/>
  <g transform="translate(20, 24) scale(0.54)">

  <!-- Consola Mega Drive (modelo 1): cuerpo negro alargado, gran círculo
       de ventilación a la izquierda y ranura de cartucho central -->
  <defs>
    <linearGradient id="mega_drivemdbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a36"/>
      <stop offset="1" stop-color="#12141c"/>
    </linearGradient>
  </defs>

  <!-- cuerpo principal -->
  <rect x="5" y="17" width="54" height="30" rx="5" fill="url(#mega_drivemdbody)" stroke="#ff5340" stroke-width="2"/>

  <!-- círculo de ventilación (la seña de identidad de la Mega Drive 1) -->
  <circle cx="18" cy="30" r="8.5" fill="#0a0b10" stroke="#ff5340" stroke-width="1.8"/>
  <circle cx="18" cy="30" r="5.5" fill="none" stroke="#ff5340" stroke-width="1" opacity="0.6"/>
  <circle cx="18" cy="30" r="2.5" fill="none" stroke="#ff5340" stroke-width="1" opacity="0.6"/>

  <!-- ranura de cartucho -->
  <rect x="31" y="21" width="23" height="9" rx="2" fill="#0a0b10" stroke="#ff5340" stroke-width="1.7"/>
  <rect x="34" y="24" width="17" height="2.6" rx="1" fill="#ff5340" opacity="0.75"/>

  <!-- interruptor de encendido y botón de reset -->
  <rect x="31" y="34" width="9" height="3.4" rx="1.4" fill="#0a0b10" stroke="#ff5340" stroke-width="1.3"/>
  <circle cx="46" cy="35.7" r="2.6" fill="#0a0b10" stroke="#ff5340" stroke-width="1.3"/>

  <!-- puertos de mando -->
  <rect x="12" y="43" width="8" height="4" rx="2" fill="#0a0b10" stroke="#ff5340" stroke-width="1.3"/>
  <rect x="24" y="43" width="8" height="4" rx="2" fill="#0a0b10" stroke="#ff5340" stroke-width="1.3"/>

  </g>
</svg>

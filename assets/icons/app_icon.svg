<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12141c"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
  </defs>
  <!-- carcasa del monitor -->
  <rect x="4" y="6" width="56" height="40" rx="5" fill="#181b26" stroke="#3ef29a" stroke-width="2.5"/>
  <!-- pantalla -->
  <rect x="9" y="11" width="46" height="30" rx="2" fill="url(#screen)"/>
  <!-- scanlines -->
  <rect x="9" y="15" width="46" height="1" fill="#3ef29a" opacity="0.08"/>
  <rect x="9" y="19" width="46" height="1" fill="#3ef29a" opacity="0.08"/>
  <rect x="9" y="23" width="46" height="1" fill="#3ef29a" opacity="0.08"/>
  <rect x="9" y="27" width="46" height="1" fill="#3ef29a" opacity="0.08"/>
  <rect x="9" y="31" width="46" height="1" fill="#3ef29a" opacity="0.08"/>
  <rect x="9" y="35" width="46" height="1" fill="#3ef29a" opacity="0.08"/>
  <!-- prompt "ROM://" con cursor -->
  <text x="14" y="30" font-family="'IBM Plex Mono', monospace" font-weight="700"
        font-size="11" fill="#3ef29a">ROM://</text>
  <rect x="45" y="23" width="6" height="9" fill="#3ef29a">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- peana -->
  <rect x="26" y="46" width="12" height="5" fill="#181b26" stroke="#3ef29a" stroke-width="2"/>
  <rect x="20" y="51" width="24" height="4" rx="1.5" fill="#181b26" stroke="#3ef29a" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Familia SNES/Genesis: disquete con silueta de cartucho asomando,
       simbolizando el volcado de ROM a disco de los copiones -->
  <defs>
    <linearGradient id="cartbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#331f14"/><stop offset="1" stop-color="#170f0a"/>
    </linearGradient>
  </defs>
  <rect x="10" y="14" width="76" height="74" rx="6" fill="url(#cartbg)" stroke="#ffb454" stroke-width="3"/>
  <path d="M34 14 H62 V24 H34 Z" fill="#0a0704"/>
  <!-- silueta de cartucho, medio insertado desde arriba -->
  <path d="M30 4 H66 L70 12 V34 H26 V12 Z" fill="#1c1410" stroke="#ffb454" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="40" y="4" width="16" height="8" rx="1.5" fill="#0a0704" stroke="#ffb454" stroke-width="1.6"/>
  <!-- ranura de la disquetera -->
  <rect x="18" y="42" width="60" height="10" rx="2" fill="#0a0704" stroke="#ffb454" stroke-width="2.2"/>
  <rect x="23" y="45.5" width="42" height="3" rx="1.5" fill="#ffb454" opacity="0.6"/>
  <!-- etiqueta 1600 -->
  <rect x="20" y="58" width="56" height="20" rx="2" fill="#0a0704" stroke="#ffb454" stroke-width="2"/>
  <text x="48" y="72" font-family="monospace" font-size="13" font-weight="700"
        fill="#ffb454" text-anchor="middle">1600K</text>
</svg>

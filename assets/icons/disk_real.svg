<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- UNIDAD REAL: disquetera clásica con disquete entrando -->
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2820"/><stop offset="1" stop-color="#14130e"/>
    </linearGradient>
  </defs>
  <!-- disquete a medio insertar -->
  <path d="M24 6 H60 L68 14 V38 H24 Z" fill="#1c2029" stroke="#ffb454" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="36" y="6" width="20" height="14" rx="1.5" fill="#0a0b10" stroke="#ffb454" stroke-width="2"/>
  <!-- cuerpo de la disquetera -->
  <rect x="6" y="40" width="84" height="46" rx="5" fill="url(#rbg)" stroke="#ffb454" stroke-width="3"/>
  <!-- ranura -->
  <rect x="16" y="50" width="64" height="11" rx="2" fill="#0a0b10" stroke="#ffb454" stroke-width="2.4"/>
  <rect x="21" y="54" width="48" height="3" rx="1.5" fill="#ffb454" opacity="0.65"/>
  <!-- botón de expulsión y LED -->
  <rect x="70" y="66" width="12" height="6" rx="2" fill="#0a0b10" stroke="#ffb454" stroke-width="2"/>
  <circle cx="20" cy="69" r="4" fill="#3ef29a"/>
  <!-- cable de datos: indica conexión interna -->
  <path d="M6 78 q-6 0 -6 -8" fill="none" stroke="#ffb454" stroke-width="2.4" opacity="0.7"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ordenador MSX: unidad con teclado integrado, vista en perspectiva -->
  <defs>
    <linearGradient id="msxbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22262f"/>
      <stop offset="1" stop-color="#12141c"/>
    </linearGradient>
  </defs>

  <!-- ranura de cartucho en la parte trasera -->
  <rect x="40" y="12" width="16" height="7" rx="1" fill="#0a0b10" stroke="#3ef29a" stroke-width="1.6"/>
  <rect x="43" y="9" width="10" height="5" rx="1" fill="#12141c" stroke="#3ef29a" stroke-width="1.4"/>

  <!-- cuerpo principal, con la cuña característica de los micros de los 80 -->
  <path d="M6 44 L10 22 H54 L58 44 Z" fill="url(#msxbody)" stroke="#3ef29a" stroke-width="2"/>

  <!-- superficie del teclado -->
  <path d="M11 41 L14 26 H50 L53 41 Z" fill="#0a0b10" opacity="0.65"/>

  <!-- filas de teclas -->
  <g fill="#3ef29a" opacity="0.85">
    <rect x="15.5" y="28" width="3.2" height="2.2" rx="0.4"/>
    <rect x="20"   y="28" width="3.2" height="2.2" rx="0.4"/>
    <rect x="24.5" y="28" width="3.2" height="2.2" rx="0.4"/>
    <rect x="29"   y="28" width="3.2" height="2.2" rx="0.4"/>
    <rect x="33.5" y="28" width="3.2" height="2.2" rx="0.4"/>
    <rect x="38"   y="28" width="3.2" height="2.2" rx="0.4"/>
    <rect x="42.5" y="28" width="3.2" height="2.2" rx="0.4"/>

    <rect x="14.8" y="32" width="3.2" height="2.2" rx="0.4"/>
    <rect x="19.3" y="32" width="3.2" height="2.2" rx="0.4"/>
    <rect x="23.8" y="32" width="3.2" height="2.2" rx="0.4"/>
    <rect x="28.3" y="32" width="3.2" height="2.2" rx="0.4"/>
    <rect x="32.8" y="32" width="3.2" height="2.2" rx="0.4"/>
    <rect x="37.3" y="32" width="3.2" height="2.2" rx="0.4"/>
    <rect x="41.8" y="32" width="3.2" height="2.2" rx="0.4"/>
  </g>

  <!-- barra espaciadora -->
  <rect x="22" y="36.2" width="20" height="2.6" rx="0.6" fill="#3ef29a" opacity="0.85"/>

  <!-- base -->
  <rect x="6" y="44" width="52" height="3.5" rx="1.2" fill="#0a0b10" stroke="#3ef29a" stroke-width="1.6"/>
</svg>
